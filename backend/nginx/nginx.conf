# Reverse proxy in front of gunicorn: buffers slow clients, serves static
# files directly, and applies a coarse rate limit at the edge before a
# request even reaches Django's own DRF throttles.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream healthcare_backend {
    server web:8000;
}

server {
    listen 80;

    client_max_body_size 10M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://healthcare_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
